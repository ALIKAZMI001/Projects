name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax-check:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile every Python file
        run: |
          python -m compileall -q . -x '(/\.git/|/\.venv/|/node_modules/)'
          echo "All Python files compile."

  docs-check:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify every README is present
        run: |
          missing=0
          for dir in computer-vision/* llm/* ai-agents/*; do
            if [ -d "$dir" ] && [ ! -f "$dir/README.md" ]; then
              echo "::error::Missing README.md in $dir"
              missing=1
            fi
          done
          exit $missing
