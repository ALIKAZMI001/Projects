name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax-check:
    name: Python Syntax Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile all Python files
        run: |
          python -m compileall -q . -x '(/\.git/|/\.venv/|/node_modules/)'
          echo "All Python source files pass syntax compilation."

  docs-check:
    name: Project README Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify every project folder has a README
        run: |
          missing=0
          for dir in */; do
            if [ "$dir" != ".github/" ] && [ -d "$dir" ] && [ ! -f "$dir/README.md" ]; then
              echo "::error::Missing README.md in $dir"
              missing=1
            fi
          done
          exit $missing
